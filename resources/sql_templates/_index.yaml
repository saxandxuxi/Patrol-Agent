  builder: _build_patrol_top_template
  match:
    subjects:
    - patrol
- id: patrol_group
  title: 巡查任务分组统计
  source: builtin
  dialect: physical
  trigger: 语义结构匹配（见 _build_patrol_group_template）
  builder: _build_patrol_group_template
  match:
    subjects:
    - patrol
- id: spatial_split
  title: 前 N 米 / 后 N 米分段对比
  source: builtin
  dialect: physical
  trigger: 语义结构匹配（见 _build_spatial_split_template）
  builder: _build_spatial_split_template
  match:
    flags:
      require:
      - spatial_split
- id: metric_top
  title: 按指标取极值（并列出并列）
  source: builtin
  dialect: physical
  trigger: 语义结构匹配（见 _build_metric_top_template）
  builder: _build_metric_top_template
  match:
    shapes:
    - top
- id: average
  title: 平均值 + 超过平均值的条数
  source: builtin
  dialect: physical
  trigger: 语义结构匹配（见 _build_average_template）
  builder: _build_average_template
  match:
    metrics:
    - avg_area
    - avg_length
    - avg
    - average
    shapes:
    - count
    - avg
    - sum
- id: distinct_pile
  title: 不同桩号计数
  source: builtin
  dialect: physical
  trigger: 语义结构匹配（见 _build_distinct_pile_template）
  builder: _build_distinct_pile_template
  match:
    metrics:
    - distinct
    derived:
    - distinct
- id: quality
  title: 时间跨度/字段缺失等质量统计
  source: builtin
  dialect: physical
  trigger: 语义结构匹配（见 _build_quality_template）
  builder: _build_quality_template
  match:
    derived:
    - quality
- id: photo_list
  title: 病害图片明细（固定取 problem_url）
  source: builtin
  dialect: physical
  # 看图诉求以前没有活的内置模板（唯一会取 problem_url 的构造器在死代码链里），
  # 于是走 Wren，图片列由 LLM 自己挑——实测挑成过 preview_url（大多是 'NULL'），
  # 用户看到"没有找到相关病害图片"，而库里有 911 条真有图的记录。
  trigger: shape=photo
  builder: _build_photo_template
  match:
    shapes:
    - photo
    subjects:
    - disease
- id: pg_point_query
  title: GPS/倾角点位查询（PostgreSQL 库）
  source: builtin
  dialect: postgresql
  # 这条原来也是"有实现没注册"：is_simple_single_query 对 PG 计划直接放行（注释说
  # "PG 只有两张空表，形状固定"），但注册表里没有 PG 条目 → build_template_sql 返回 None
  # → 落到 Wren，而 Wren 的 MDL 里没有 gps_points（实测报错
  # "table 'wren.public.gps_points' not found"）。接上 _build_pg_template 后，
  # PG 题直接按表名/设备/时间拼 SQL 查物理库，不再经过 Wren。
  trigger: kind=postgresql（点位表按设备号/时间过滤）
  builder: _build_pg_template
  match:
    kinds:
    - postgresql
    shapes:
    - count
    - trend
    - list
    - detail
    - photo
