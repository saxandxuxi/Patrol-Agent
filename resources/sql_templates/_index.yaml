version: 3
templates:
- id: route_density
  title: 病害最密集桩号段（按 100 米分桶）
  source: builtin
  dialect: physical
  # 原来是空壳条目（既没 builder 也没 match，永远选不中）：标题写的是"处/公里"，那件事
  # 已经由下面的 per_km（_build_per_km_template）承担。这里接上真正没人指向的实现
  # _build_density_template——它算的是"病害主要集中在哪一片"（100 米分桶取最密集的前 3 段），
  # 所以标题按它的实际口径改。
  trigger: shape=top + group_by=pile_bucket + 主体=disease
  builder: _build_density_template
  match:
    # 桩号分段题只有在"要最密集的那几段"（shape=top）时才用这条；
    # 要全部分段列表的走上面的 pile_bucket。
    shapes:
    - top
    subjects:
    - disease
    group_by:
    - pile_bucket
- id: pile_bucket
  title: 按桩号分段统计
  source: builtin
  dialect: physical
  trigger: group_by=pile_bucket
  builder: _build_pile_bucket_template
  match:
    group_by:
    - pile_bucket
    flags:
      forbid:
      # 用户明说"前 N 米 / 后 N 米哪段多"时，按 100 米分段是另一个口径：
      # 两套模板分数相同时会按声明顺序被它抢先，结果给出一张分段表而不是"哪段多"。
      - spatial_split
- id: bucket
  title: 按指标中位数分两档对比
  source: builtin
  dialect: physical
  trigger: 语义结构匹配（见 _build_bucket_template）
  builder: _build_bucket_template
  match:
    shapes:
    - bucket_compare
    flags:
      forbid:
      - numeric_condition
      - spatial_split
- id: multi_route
  title: 多路线对比（每条路一行）
  source: builtin
  dialect: physical
  trigger: 语义结构匹配（见 _build_multi_route_template）
  builder: _build_multi_route_template
  match:
    group_by:
    - route
    metrics:
    - avg_area
    - total_area
    - max_area
    - avg_length
    - count
    flags:
      require:
      - multi_route
  match_alt:
    group_by:
    - route
    metrics:
    - avg_area
    - total_area
    - max_area
- id: known_unknown
  title: 已识别类型 vs 未识别类型分别计数
  source: builtin
  dialect: physical
  trigger: 语义结构匹配（见 _build_known_unknown_template）
  builder: _build_known_unknown_template
  match:
    shapes:
    - distribution
    group_by:
    - damage_type
    flags:
      require:
      - has_damage_filter
- id: ratio
  title: 占比计算（部分 ÷ 总数）
  source: builtin
  dialect: physical
  trigger: 语义结构匹配（见 _build_ratio_template）
  builder: _build_ratio_template
  match:
    derived:
    - ratio
- id: multi_metric
  title: 一问多答（多个口径各占一列）
  source: builtin
  dialect: physical
  trigger: 语义结构匹配（见 _build_multi_metric_template）
  builder: _build_multi_metric_template
  match:
    flags:
      require:
      - multi_metric
    shapes:
    - count
    - sum
    - avg
- id: table_count
  title: 台账/对象计数
  source: builtin
  dialect: physical
  trigger: 语义结构匹配（见 _build_table_count_template）
  builder: _build_table_count_template
  match:
    # 只有"数一数"（shape=count）才用它："台账信息/基本情况"是 list，交给下面的 route_info；
    # 这条以前靠构造器里的关键词判断，现在由语义声明承担（LLM 优先，关键词只兜底）
    shapes:
    - count
    subjects:
    - route
    - section
    - pile_point
    - asset
    - work_order
    - patrol
- id: route_info
  title: 路线台账信息
  source: builtin
  dialect: physical
  trigger: 语义结构匹配（见 _build_route_info_template）
  builder: _build_route_info_template
  match:
    # 看台账字段（基本情况/台账信息）是 list；数台账条数是上面的 table_count
    shapes:
    - list
    subjects:
    - route
  match_alt:
    shapes:
    - count
    subjects:
    - route
    - section
    flags:
      require:
      - route_length
- id: per_km
  title: 每公里指标（密度/间距）
  source: builtin
  dialect: physical
  trigger: 语义结构匹配（见 _build_per_km_template）
  builder: _build_per_km_template
  match:
    derived:
    - density
    - interval
- id: threshold_count
  title: 数值阈值筛选后计数
  source: builtin
  dialect: physical
  trigger: 语义结构匹配（见 _build_threshold_count_template）
  builder: _build_threshold_count_template
  match:
    flags:
      require:
      - numeric_condition
- id: coverage_compare
  title: 覆盖范围对比
  source: builtin
  dialect: physical
  trigger: 语义结构匹配（见 _build_coverage_compare_template）
  builder: _build_coverage_compare_template
  match:
    subjects:
    - route
    flags:
      require:
      - multi_route
- id: other_routes
  title: 不属于指定路线的病害
  source: builtin
  dialect: physical
  trigger: 语义结构匹配（见 _build_other_routes_template）
  builder: _build_other_routes_template
  match:
    flags:
      require:
      - multi_route
- id: generic_metric
  title: 通用「维度 × 指标」聚合
  source: builtin
  dialect: physical
  trigger: 语义结构匹配（见 _build_generic_metric_template）
  builder: _build_generic_metric_template
  match:
    shapes:
    - distribution
    - trend
    # ⚠️ `top` **暂时不能加**：加了它，整句"哪X最多？把明细列出来"在总闸那一步就会命中本模板，
    # 总闸据此认为"模板能一次答对"→ 不再拆解 → 第二问（要明细）被整句吞掉（实测 0 分段）。
    # 要加它，得先把总闸从"模板命中就不拆"改成吃语义 JSON（planner 的 is_simple），
    # 见 docs/时间分组维度完善方案.md 之后这轮的结论。
    group_by:
    # 时间维度：新加的粒度必须在这里声明，否则模板不命中、整句落到 Wren
    # （`_plan_dimension` 能算出表达式也没用——选模板是按这张声明表匹配的）。
    # every_n_days/hours/minutes 不列：它们的表达式要带 N，由 Wren + _time_bucket_hint 处理。
    - year
    - half_year
    - quarter
    - season
    - month
    - half_month
    - ten_day
    - day
    - hour
    - workday
    - time_of_day
    - minute
    - dow
    - week
    - route
    - damage_type
    - direction
    - device
    - pile_bucket
    flags:
      forbid:
      - comparison
- id: patrol_task
  title: 巡查任务统计
  source: builtin
  dialect: physical
  trigger: 语义结构匹配（见 _build_patrol_task_template）
  builder: _build_patrol_task_template
  match:
    subjects:
    - patrol
- id: patrol_route_overview
  title: 巡查任务路线与病害归属概览
  source: builtin
