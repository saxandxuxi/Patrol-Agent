metrics:
  disease:
    count:
      expression: COUNT(*)
      label: 数量
      unit: 处
      allowed_views:
      - count
      - distribution
      - top_groups
      - trend
    total_area:
      expression: SUM({alias}.area)
      label: 总面积
      unit: ㎡
      allowed_views: [count, distribution, top_groups, trend]
    average_area:
      expression: AVG({alias}.area)
      label: 平均面积
      unit: ㎡
      allowed_views: [count, distribution, top_groups, trend]
    sum_disease_length:
      expression: SUM({alias}.effective_disease_length)
      label: 病害总长度
      unit: 米
      allowed_views: [count, distribution, top_groups, trend]
    sum_effective_disease_length:
      expression: SUM({alias}.effective_disease_length)
      label: 有效病害总长度
      unit: 米
      allowed_views: [count, distribution, top_groups, trend]
    # 条状病害按 0.2 米宽把长度换算成面积：热点桩号段的“换算面积”口径。
    # 口径自带病害范围（条状修补是巡检库注册的条状病害类型），缺类型过滤时
    # 也不会把坑槽、垃圾这类非条状病害的长度算进来。
    strip_converted_area:
      expression: SUM(CASE WHEN {alias}.problem_type_name = '条状修补' THEN {alias}.effective_disease_length * 0.2 ELSE 0 END)
      label: 条状病害换算面积
      unit: ㎡
      allowed_views: [count, distribution, top_groups, trend]
    # 长度指标只认语义字段 effective_disease_length：原始列 disease_length
    # 大面积为空（坑槽 44 条全为空），自动生成的 avg_/max_/min_ 会算出 NULL。
    avg_disease_length:
      expression: AVG({alias}.effective_disease_length)
      label: 平均病害长度
      unit: 米
      allowed_views: [count, distribution, top_groups, trend]
    max_disease_length:
      expression: MAX({alias}.effective_disease_length)
      label: 最长病害长度
      unit: 米
      allowed_views: [count, distribution, top_groups, trend]
    min_disease_length:
      expression: MIN({alias}.effective_disease_length)
      label: 最短病害长度
      unit: 米
      allowed_views: [count, distribution, top_groups, trend]
    # “多少种病害类型”是去重计数，不是记录条数：没有这条指标时模型只能拿
    # count 顶上，把 21413 处病害说成 21413 种类型。
    distinct_problem_type_count:
      expression: COUNT(DISTINCT {alias}.problem_type_name)
      label: 病害类型种数
      unit: 种
      allowed_views: [count, distribution, top_groups, trend]
    route_length_km:
      expression: "{route}.route_length_km"
      label: 路线长度
      unit: km
      allowed_views: [count, distribution, top_groups]
      requires_join: [route]
      # 路线长度只由路线决定；当同一结果内只有一条且数值一致时，
      # 可传播到缺失的枚举分组（如某方向 0 处），不能凭空补 0。
      propagate_across_groups: true
  patrol:
    count:
      expression: COUNT(*)
      label: 数量
      unit: 次
      allowed_views: [count, distribution, top_groups, trend]
    # 结果行仍是一次巡检任务，病害数量只是该任务关联病害的聚合；
    # 不能把 patrol.count（任务次数）冒充病害检出数。
    linked_disease_count:
      expression: COUNT(DISTINCT {disease}.id)
      label: 任务关联病害数
      unit: 处
      allowed_views: [count, distribution, top_groups, trend]
      requires_join: [disease]
    patrol_mileage:
      # 数据库中的 patrol_mileage 存的是米，指标对外统一输出公里。
      expression: SUM({alias}.patrol_mileage) / 1000.0
      label: 巡检里程
      unit: km
      allowed_views: [count, distribution, top_groups, trend]
  _field_metric_generation:
    # 自动生成的 SUM/AVG/MIN/MAX 必须沿用字段的物理单位换算，不能因为换了一个
    # 指标 ID 就绕过显式指标的单位口径。
    patrol:
      patrol_mileage:
        divisor: "1000.0"
        unit: km
  _lexicon:
    metric_expressions:
    - fallback_words:
      - 置信度
      - 可信度
      - 信度
      expr: CAST(JSON_UNQUOTE(JSON_EXTRACT(p.pic_position, '$.confidence')) AS DECIMAL(10,6))
    - fallback_words:
      - 标注宽度
      - 图片宽度
      - AI 宽度
      expr: CAST(JSON_UNQUOTE(JSON_EXTRACT(p.pic_position, '$.width')) AS DECIMAL(10,2))
    - fallback_words:
      - 标注高度
      - 图片高度
      - AI 高度
      expr: CAST(JSON_UNQUOTE(JSON_EXTRACT(p.pic_position, '$.height')) AS DECIMAL(10,2))
    - fallback_words:
      - 面积
      expr: p.area
    - fallback_words:
      - 长度
      expr: CASE WHEN p.disease_length IS NOT NULL AND p.disease_length > 0 THEN p.disease_length ELSE GREATEST(COALESCE(p.area_height,
        0), COALESCE(p.area_width, 0)) END
    dimensions:
    - key: week
      fallback_words:
      - 哪几周
      - 按周
      - 第几周
      - 周维度
      - 每周
      expr: CONCAT(DATE_FORMAT(p.collection_time, '%x'), '年第', DATE_FORMAT(p.collection_time, '%v'), '周')
    - key: half_month
      fallback_words:
      - 半个月
      - 上半月
      - 下半月
      - 每半个月
      expr: CONCAT(DATE_FORMAT(p.collection_time, '%Y年%m月'), IF(DAY(p.collection_time) <= 15, '上半月', '下半月'))
    - key: dow
      fallback_words:
      - 星期几
      - 周几
      - 星期
      - 工作日
      expr: CASE DAYOFWEEK(p.collection_time) WHEN 1 THEN '周日' WHEN 2 THEN '周一' WHEN 3 THEN '周二' WHEN 4 THEN '周三' WHEN 5 THEN
        '周四' WHEN 6 THEN '周五' ELSE '周六' END
    - key: hour
      fallback_words:
      - 几点
      - 时段
      - 时间段
      - 小时
      expr: HOUR(p.collection_time)
    - key: day
      fallback_words:
      - 哪天
      - 每天
      - 按日
      - 单日
      - 每日
      - 最近一次
      - 最近
      expr: DATE(p.collection_time)
    - key: month
      fallback_words:
      - 哪个月
      - 按月
      - 每月的
      - 月份
      expr: DATE_FORMAT(p.collection_time, '%Y-%m')
    - key: route
      fallback_words:
      - 哪条路
      - 各条路
      - 每条路
      - 哪条路线
      - 分布在哪
      - 按路线
      - 分路线
      expr: r.short_name
    - key: damage_type
      fallback_words:
      - 什么类型
      - 各类型
      - 按类型
      - 哪些类型
      - 什么病害
      - 病害类型
      - 哪种病害
      - 哪种类型
      expr: COALESCE(b.problem_type, '未知类型')
    - key: direction
      fallback_words:
      - 上行还是下行
      - 上下行
      - 什么方向
      - 方向分布
      - 上行和下行
      - 上行、下行
      - 各方向
      expr: CASE p.up_or_down WHEN '1' THEN '上行' WHEN '2' THEN '下行' WHEN '0' THEN '全部' WHEN '' THEN '未填' ELSE CONCAT('未知(',
        p.up_or_down, ')') END
    - key: device
      fallback_words:
      - 哪台设备
      - 每台设备
      - 按设备
      expr: p.device_code
    time_buckets:
      day:
      - DATE({alias}.collection_time)
      - DATE({alias}.collection_time)
      week:
      - CONCAT(DATE_FORMAT({alias}.collection_time, '%x'), '年第', DATE_FORMAT({alias}.collection_time, '%v'), '周')
      - CONCAT(DATE_FORMAT({alias}.collection_time, '%x'), '年第', DATE_FORMAT({alias}.collection_time, '%v'), '周')
      - YEARWEEK({alias}.collection_time, 3)
      half_month:
      - CONCAT(DATE_FORMAT({alias}.collection_time, '%Y年%m月'), IF(DAY({alias}.collection_time) <= 15, '上半月', '下半月'))
      - CONCAT(DATE_FORMAT({alias}.collection_time, '%Y年%m月'), IF(DAY({alias}.collection_time) <= 15, '上半月', '下半月'))
      month:
      - DATE_FORMAT({alias}.collection_time, '%Y-%m')
      - DATE_FORMAT({alias}.collection_time, '%Y-%m')
      hour:
      - HOUR({alias}.collection_time)
      - HOUR({alias}.collection_time)
      year:
      - CONCAT(YEAR({alias}.collection_time), '年')
      - CONCAT(YEAR({alias}.collection_time), '年')
      half_year:
      - CONCAT(YEAR({alias}.collection_time), '年', IF(MONTH({alias}.collection_time) <= 6, '上半年', '下半年'))
      - CONCAT(YEAR({alias}.collection_time), '年', IF(MONTH({alias}.collection_time) <= 6, '上半年', '下半年'))
      quarter:
      - CONCAT(YEAR({alias}.collection_time), '年第', QUARTER({alias}.collection_time), '季度')
      - CONCAT(YEAR({alias}.collection_time), '年第', QUARTER({alias}.collection_time), '季度')
      season:
      - CONCAT(IF(MONTH({alias}.collection_time) <= 2, YEAR({alias}.collection_time) - 1, YEAR({alias}.collection_time)),
        '年', CASE WHEN MONTH({alias}.collection_time) IN (3,4,5) THEN '春季' WHEN MONTH({alias}.collection_time) IN (6,7,8)
        THEN '夏季' WHEN MONTH({alias}.collection_time) IN (9,10,11) THEN '秋季' ELSE '冬季' END)
      - CONCAT(IF(MONTH({alias}.collection_time) <= 2, YEAR({alias}.collection_time) - 1, YEAR({alias}.collection_time)),
        '年', CASE WHEN MONTH({alias}.collection_time) IN (3,4,5) THEN '春季' WHEN MONTH({alias}.collection_time) IN (6,7,8)
        THEN '夏季' WHEN MONTH({alias}.collection_time) IN (9,10,11) THEN '秋季' ELSE '冬季' END)
      - CONCAT(IF(MONTH({alias}.collection_time) <= 2, YEAR({alias}.collection_time) - 1, YEAR({alias}.collection_time)),
        CASE WHEN MONTH({alias}.collection_time) IN (3,4,5) THEN '1' WHEN MONTH({alias}.collection_time) IN (6,7,8) THEN '2'
        WHEN MONTH({alias}.collection_time) IN (9,10,11) THEN '3' ELSE '4' END)
      ten_day:
      - CONCAT(DATE_FORMAT({alias}.collection_time, '%Y年%m月'), CASE WHEN DAY({alias}.collection_time) <= 10 THEN '上旬' WHEN
        DAY({alias}.collection_time) <= 20 THEN '中旬' ELSE '下旬' END)
      - CONCAT(DATE_FORMAT({alias}.collection_time, '%Y年%m月'), CASE WHEN DAY({alias}.collection_time) <= 10 THEN '上旬' WHEN
        DAY({alias}.collection_time) <= 20 THEN '中旬' ELSE '下旬' END)
      - CONCAT(DATE_FORMAT({alias}.collection_time, '%Y%m'), CASE WHEN DAY({alias}.collection_time) <= 10 THEN '1' WHEN DAY({alias}.collection_time)
        <= 20 THEN '2' ELSE '3' END)
      dow:
      - CASE DAYOFWEEK({alias}.collection_time) WHEN 1 THEN '周日' WHEN 2 THEN '周一' WHEN 3 THEN '周二' WHEN 4 THEN '周三' WHEN 5
        THEN '周四' WHEN 6 THEN '周五' ELSE '周六' END
      - CASE DAYOFWEEK({alias}.collection_time) WHEN 1 THEN '周日' WHEN 2 THEN '周一' WHEN 3 THEN '周二' WHEN 4 THEN '周三' WHEN 5
        THEN '周四' WHEN 6 THEN '周五' ELSE '周六' END
      - WEEKDAY({alias}.collection_time)
      workday:
      - CASE WHEN WEEKDAY({alias}.collection_time) <= 4 THEN '工作日' ELSE '周末' END
      - CASE WHEN WEEKDAY({alias}.collection_time) <= 4 THEN '工作日' ELSE '周末' END
      - WEEKDAY({alias}.collection_time) <= 4
      time_of_day:
      - CASE WHEN HOUR({alias}.collection_time) < 6 THEN '凌晨' WHEN HOUR({alias}.collection_time) < 12 THEN '上午' WHEN HOUR({alias}.collection_time)
        < 18 THEN '下午' ELSE '晚上' END
      - CASE WHEN HOUR({alias}.collection_time) < 6 THEN '凌晨' WHEN HOUR({alias}.collection_time) < 12 THEN '上午' WHEN HOUR({alias}.collection_time)
        < 18 THEN '下午' ELSE '晚上' END
      - CASE WHEN HOUR({alias}.collection_time) < 6 THEN '1' WHEN HOUR({alias}.collection_time) < 12 THEN '2' WHEN HOUR({alias}.collection_time)
        < 18 THEN '3' ELSE '4' END
      minute:
      - DATE_FORMAT({alias}.collection_time, '%Y-%m-%d %H:%i')
      - DATE_FORMAT({alias}.collection_time, '%Y-%m-%d %H:%i')
    numeric_fields:
    - fallback_words:
      - 面积
      expr: p.area
    - fallback_words:
      - 置信度
      - 可信度
      - 信度
      expr: CAST(JSON_UNQUOTE(JSON_EXTRACT(p.pic_position, '$.confidence')) AS DECIMAL(10,6))
    - fallback_words:
      - 标注宽度
      - 图片宽度
      - AI 宽度
      - 标注框宽
      expr: CAST(JSON_UNQUOTE(JSON_EXTRACT(p.pic_position, '$.width')) AS DECIMAL(10,2))
    - fallback_words:
      - 标注高度
      - 图片高度
      - AI 高度
      - 标注框高
      expr: CAST(JSON_UNQUOTE(JSON_EXTRACT(p.pic_position, '$.height')) AS DECIMAL(10,2))
    - fallback_words:
      - 标注经度
      - 图片经度
      - 标注框经度
      expr: CAST(JSON_UNQUOTE(JSON_EXTRACT(p.pic_position, '$.lng')) AS DECIMAL(12,8))
    - fallback_words:
      - 标注纬度
      - 图片纬度
      - 标注框纬度
      expr: CAST(JSON_UNQUOTE(JSON_EXTRACT(p.pic_position, '$.lat')) AS DECIMAL(12,8))
    - fallback_words:
      - 长度
      expr: CASE WHEN p.disease_length IS NOT NULL AND p.disease_length > 0 THEN p.disease_length ELSE GREATEST(COALESCE(p.area_height,
        0), COALESCE(p.area_width, 0)) END
    - fallback_words:
      - 桩号
      - 里程
      expr: p.pile_distance
    numeric_ops:
    - - 大于等于
      - '>='
    - - 不小于
      - '>='
    - - 不超过
      - <=
    - - 不高于
      - <=
    - - 等于
      - '='
    - - 正好
      - '='
    - - 恰好
      - '='
    - - 刚好
      - '='
    - - 为
      - '='
    - - 超过
      - '>'
    - - 大于
      - '>'
    - - 小于
      - <
    - - 低于
      - <
    - - 高于
      - '>'
    - - '>='
      - '>='
    - - <=
      - <=
    - - ≥
      - '>='
    - - ≤
      - <=
    - - '>'
      - '>'
    - - <
      - <
    - - '='
      - '='
