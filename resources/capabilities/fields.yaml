fields:
  disease:
    id:
      expression: disease.id
      label: 病害ID
      roles: [output]
      physical_table: ai_problem
      physical_column: id
    up_or_down:
      expression: disease.up_or_down
      label: 上下行
      roles: [code, dimension]
      physical_table: ai_problem
      physical_column: up_or_down
      enum_key: ai_problem.up_or_down
    route_length_km:
      expression: route.route_length_km
      label: 路线长度
      unit: km
      roles: [metric]
      physical_table: basic_facilities_routes
      physical_column: route_length_km
      requires_join: [route]
    route_level:
      expression: route.level
      label: 行政等级
      roles: [code, dimension]
      physical_table: basic_facilities_routes
      physical_column: level
      requires_join: [route]
      enum_key: basic_facilities_routes.level
    tech_grade:
      expression: section.tech_grade
      label: 公路技术等级
      roles: [code, dimension]
      physical_table: basic_facilities_sections
      physical_column: tech_grade
      requires_join: [section]
      enum_key: basic_facilities_sections.tech_grade
