calculators:
  calculate_scalar:
    input_shapes: [scalar_list]
    source_selectors: [row_index]
    operations:
      [add, subtract, multiply, divide, ratio, percentage_share, percentage_change]
    precision: 6
    zero_denominator: error
  calculate_columns:
    input_shapes: [rows]
    operations:
      [add, subtract, multiply, divide, ratio, percentage_share, percentage_change]
    precision: 6
    zero_denominator: skip_rows
  calculate_series:
    input_shapes: [series]
    operations: [subtract, percentage_change]
    precision: 6
    zero_denominator: error
  calculate_group_change:
    input_shapes: [paired_grouped_rows]
    operations: [subtract, percentage_change]
    precision: 6
    zero_denominator: undefined
  calculate_datetime_interval:
    input_shapes: [temporal_scalar_list]
    operations: [elapsed_days]
    precision: 6
    zero_denominator: error
