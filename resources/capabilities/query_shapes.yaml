query_shapes:
  planner_semantics:
    answer_operations:
      single_result:
        meaning: 一个查询视图即可回答问题。
      scalar_with_details:
        meaning: 同一用户范围内既要一个总体标量，又要一份对象明细列表。
        scalar_views:
        - count
        - sum
        - avg
        detail_views:
        - list
        - detail
        same_subject: true
        same_filters: true
      scalar_comparison:
        meaning: 只比较两个或多个已有数值的大小或谁多谁少，不产生新的算术数字。
      scalar_difference:
        meaning: 除比较大小外，还必须给出两个数值之间的差值等新算术结果。
        required_tool: calculate_scalar
        required_operation: subtract
      group_share:
        meaning: 对多个分组逐行计算各自占同一总量的比例、百分比或成数。
        required_tool: calculate_columns
        required_operation:
        - ratio
        - percentage_share
        required_dependency_views:
        - distribution
        - top_groups
        - trend
      group_total:
        meaning: 同时返回分组结果和同一用户范围内的总体值。
        required_dependency_views:
        - distribution
        - top_groups
        - trend
        required_aggregate:
          same_subject: true
          same_filters: true
          no_dimensions: true
          same_metrics: true
      group_change:
        meaning: 对齐前次与后次两个同形分组结果，逐组计算数量差值或百分比变化，并识别最大增加。
        required_tool: calculate_group_change
        required_operation:
        - subtract
        - percentage_change
        required_dependency_views:
        - distribution
        - top_groups
        required_same:
        - subject
        - kind
        - dimensions
        - metric
      entity_set_comparison:
        meaning: 比较两个真实批次之间新增或消失的病害、巡检等实体记录。
        required_assertion: dataset_comparison
        required_dependency_views: [list, detail]
        required_identity_field:
          disease: problem_number
          patrol: [task_number, patrol_number]
      trend:
        meaning: 用户要求观察时间序列的变化方向。
        default_time_dimension: month
      ranking:
        meaning: 用户要求按真实指标返回极值或前 N 名。
      analysis:
        meaning: 用户要求基于已有事实解释、归纳或比较多个指标。
      unsupported:
        meaning: 当前字段、实体或数据覆盖无法可靠回答。
    view_selection:
      ordered_complete_result:
        meaning: 用户要求按指标排序并查看全部对象，但没有给出明确的前 N 数量。
        grouped_view: distribution
        detail_view: list
        preserve_order_by: true
        limit: null
      explicit_top_n:
        meaning: 用户明确给出了前几名、最多几个或前 N 条。
        grouped_view: top_groups
        detail_view: top_records
        require_positive_limit: true
        require_order_by: true
      ranking_requires_order_by: true
      ordered_complete_has_no_limit: true
    time_scope:
      new_records_without_baseline:
        meaning: 用户只给出一个时间范围并询问新增情况，未给出上一周期或上一次巡查作为比较基线。
        default_scope: 统计该时间范围内新采集或新发现的病害记录。
        preserve_conditions:
        - 用户原话中的路线、病害类型和其他过滤条件
        - 明确的时间范围
        prohibited_defaults:
        - 不得自行推断上一周期，也不得把时间范围内的总量说成相对增量。
        - 不得把“新增”映射为 problem_source 或其他枚举条件。
        final_answer_note: 必须说明这是所选时间范围内新采集或新发现的记录口径。
      explicit_period_comparison:
        meaning: 用户明确要求与上一周期、上一季度或上一次巡查比较。
        required_shape: 为每个周期生成同形数据节点，再由 post_calc 计算或解释差值。
        entity_scope_note: 如果比较对象是“新增或消失的病害/任务实体”，按 entity_set_comparison 的明细与身份字段契约执行，不能只见“比较”就做 COUNT 相减。
      recent_patrol_batches:
        meaning: 用户要求最近 N 次巡查或最近 N 个巡检批次时，先建立真实巡检批次序列，再由后续病害事实消费该序列。
        trusted: false
        source: 用户原话与已登记的时间、批次字段
        batch_entity: patrol
        batch_dimension: patrol_number
        required_sequence:
          - patrol_batch
          - disease
        required_assertions:
          - recent_window
          - preserve_user_scope
        rules:
          - 不得把最近巡检直接解释成 create_time 排序后代替批次序列。
          - 后续病害节点必须通过结构化 inputs 消费批次维度，并继续使用原路线、时间、病害等范围。
          - 最终病害分布按真实指标排序，不得用时间排序冒充数量或面积排名。
    segment_patrol_evidence:
      meaning: 巡检任务没有完整桩号覆盖字段时，用户仍可按“该路段实际产生过病害记录”的巡检批次提问；该口径只证明任务在该路段留下了病害记录，不证明任务完整巡检了整段。
      allowed_subject: disease
      required_filters: [route_name, pile_number]
      batch_dimension: patrol_number
      batch_assertion: recent_window
      final_answer_note: 必须写明“这是按病害记录定位的巡检批次”，不能把结果说成完整巡检覆盖。
    task_disease_evidence:
      meaning: 用户要找出满足病害属性条件的巡检任务时，病害属性用于筛选和计数，任务只是这些病害记录所属的批次身份；必须先由病害记录关联巡检任务，再按任务编号分组。
      allowed_subject: disease
      required_identity_join: disease.patrol_id -> disease_patrol.id
      batch_dimensions: [task_number]
      alternate_batch_dimensions: [patrol_number]
      final_answer_note: 结果只代表实际检出了匹配病害的任务，不得直接过滤巡检任务表上的病害字段，也不得声称这些任务完整覆盖了相关路段。
    unanchored_pile_segment:
      meaning: 用户只说“K50路段”而未给起止边界时，按 K50+000 至 K51+000 的 1 公里路段理解；用户给出明确起止边界时始终以用户边界为准。
      default_span_m: 1000
      start_boundary: 含起点
      end_boundary: 不含终点
    entity_set_comparison:
      meaning: 用户要求比较两次巡查、两个批次或两个时间点之间新增或消失的实体记录。
      required_assertions:
      - dataset_comparison
      allowed_dependency_views:
      - list
      - detail
      identity_fields:
        disease:
        - problem_number
        patrol:
        - task_number
        - patrol_number
      rules:
      - 两个数据节点必须使用相同的实体身份字段，并按两个真实的巡查批次或周期取数。
      - 不允许用两个 COUNT 指标相减代替实体集合差集。
      - 用户给出两个日期时，必须先把日期落实为对应路线、对应巡检批次；日期没有对应批次时返回明确的口径缺失或不可用原因。
    enum_dimension_completion:
      assertion: complete_enum_dimensions
      meaning: 用户明确要求查看某个闭集枚举维度的全部实际成员时，结果必须补出缺失成员并按 0 展示，不能把“未返回该分组”解释成无法判断。
      default_complete_fields:
        disease:
        - up_or_down
      excluded_values:
      - 全部/未区分
      - 全部/未知
      - 未区分
      - 未知
      - 未填写
      - 未识别
    nested_top_groups:
      assertion: top_per_outer_group
      meaning: 用户要求每个外层类别分别返回组内前 N 名时，按外层类别分区排名，不能把整个结果集只取全局前 N 名。
      required_view: top_groups
      dimension_order:
      - outer_group_dimension
      - within_group_ranking_dimension
      limit_meaning: 每个外层分区内保留的行数
    relation_existence:
      meaning: 用户要求当前主体至少存在一条已登记关联记录时，使用关系存在谓词，不把关联数量塞进明细或分组指标。
      filter:
        op: exists
        raw_value: true
      rules:
      - 只能使用当前主体 fields 中 roles 包含 relation_exists 的字段。
      - 关系拓扑和 JOIN 条件由 MDL 关系目录提供，能力配置只登记业务谓词和关系 ID。
      - 关系存在字段只能进入 filters，不能进入 output_projection、dimensions 或 metrics。
      - 不得用版本号、计数排序或全量关联代替存在性判断。
  count:
