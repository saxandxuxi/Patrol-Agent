# 语义键表（docs/代码结构重构与模板外置方案.md §5.3）
# 语义层（LLM）允许输出的键、以及代码认识的键。新增一种"说法/维度/指标"只改这里，不用动 .py。
semantic:
  shapes: [count, sum, avg, distribution, list, top, trend, bucket_compare]
  # 台账类资产各算一个主体（bridge/tunnel/slope/project）：登记后"桥梁的技术等级"这类问题
  # 主体与落点表一致，不再回落成 disease/asset 只靠字段触达救落点
  subjects: [disease, pile_point, section, patrol, work_order, asset, route, bridge, tunnel, slope, project]
  group_by:
    - damage_type
    - pic_type               # 图片标注类型（pic_position JSON 里的 type）：和 damage_type 是两回事
    - route
    - section
    - route_level           # 路线行政等级（国道/省道/县道/乡道/村道）
    - tech_grade            # 公路技术等级（高速/一至四级公路/等外）
    - surface_type          # 路面类型（沥青混凝土/水泥混凝土…）
    - direction
    - image_presence
    - category
    - month
    - day
    - week
    - half_month             # 半个月（上半月 1-15 / 下半月 16-月底）——用户说"每半个月/哪半个月"时用
    - hour
    # 其余时间粒度（从粗到细）。**这里才是生效的合法值集合**：nl2sql.py 里那份默认值会被本段整个替换。
    # 具体分组表达式在 metrics.yaml 的 time_buckets（每 N 天/小时/分钟 由 _time_bucket_hint 现算）。
    - year
    - half_year              # 上半年 1-6 月 / 下半年 7-12 月
    - quarter                # 自然季度 Q1-Q4
    - season                 # 春 3-5 / 夏 6-8 / 秋 9-11 / 冬 12-2（跨年）
    - ten_day                # 旬：上旬 1-10 / 中旬 11-20 / 下旬 21-月底
    - dow                    # 星期几（周一到周日，循环维度）
    - workday                # 工作日（周一~周五）/ 周末
    - time_of_day            # 凌晨 0-6 / 上午 6-12 / 下午 12-18 / 晚上 18-24
    - minute                 # 按分钟
    - every_n_days           # 每 N 天（N 走 group_by_params）
    - every_n_hours          # 每 N 小时
    - every_n_minutes        # 每 N 分钟
    - device
    - confidence
    - area_bucket
    - pile_bucket            # 桩号分段：识别不出来会掉到 null，必须列在这里
    - manage_dept
    # 冷门维度（ai_problem 里真实存在的列）：工单状态/病害来源/收藏/是否绑任务/路格/历史损坏程度
    - problem_status
    - problem_source
    - collect
    - mission_flag
    - luge_name
    - history_damage_interval
  metrics: [count, total_area, avg_area, max_area, min_area, avg_length, sum_effective_disease_length, total_effective_disease_length, avg_effective_disease_length, max_effective_disease_length, min_effective_disease_length, converted_area, confidence, ratio, density, interval, rate, distinct_pile, duration]
  derived: [ratio, density, interval, difference, linear_area]
  output_fields: [problem_number, pile_number, area, confidence, collection_time, route_name, problem_type_name, lng_lat, image, memo]
  order: [count_desc, count_asc, metric_desc, metric_asc]
  # 比较符白名单（语义层只能给这里列出的 op；"没填的/有值的"用后四个空值判断）
  condition_ops: ["=", "!=", ">", ">=", "<", "<=", between, in, is_null, not_null, empty, not_empty]
