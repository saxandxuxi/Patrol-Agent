# 兜底触发词 / 识别词表（docs/代码结构重构与模板外置方案.md §5.3）
# 这里放"用户可能怎么说"的词表；判断逻辑仍在代码里，但**新增说法只改这个文件**。
profiling:
  # 元数据类问题（哪些字段没数据 / 空值率 / 完整度）→ 直接走数据画像，不进业务 plan
  subjects: [字段, 列, 表]
  signals:
    - 没数据
    - 没有数据
    - 没填
    - 没值
    - 没有值
    - 一个值都
    - 全为空
    - 全空
    - 空字段
    - 空值率
    - 空值
    - 完整度
    - 完整率
    - 填报
    - 覆盖率
    - 各表数据量
    - 数据画像
    - 数据量
capability:
  # 命中确定性能力时的兜底提示词（语义层不可用时要用的那批）
  reuse_words: [用这条, 沿用, 同一条, 上次那条]
  ai_words: [让 AI, 重新查, 自己查, 重新生成]
