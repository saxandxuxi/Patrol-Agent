# Wren MDL 关系定义：编译器据此自动加 JOIN，LLM 不需要写 JOIN
relationships:
  # source: manual 人工维护
- name: disease_route
  models:
  - disease
  - route
  join_type: MANY_TO_ONE
  condition: disease.routes_id = route.id
  # source: manual 人工维护
- name: disease_section
  models:
  - disease
  - section
  join_type: MANY_TO_ONE
  condition: disease.sections_id = section.id
