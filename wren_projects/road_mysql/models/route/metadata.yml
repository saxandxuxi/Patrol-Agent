- name: level_name
  type: VARCHAR
  is_calculated: true
  expression: CASE level WHEN '0' THEN '国道' WHEN '1' THEN '省道' WHEN '2' THEN '县道' WHEN '3' THEN '乡道' WHEN '4' THEN '村道' ELSE COALESCE(NULLIF(level, ''), '未填写') END
  properties:
    description: 行政等级
