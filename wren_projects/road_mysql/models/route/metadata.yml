name: route
properties:
  description: 路线台账：路线名、技术等级、车道数、路面宽度、起止桩号。路线过滤走这里。
ref_sql: "SELECT *,\n       COALESCE(\n         NULLIF(\n           (\n             CAST(SUBSTRING_INDEX(SUBSTRING_INDEX(end_num, '+', 1), 'K', -1) AS UNSIGNED) * 1000\n             + CAST(SUBSTRING_INDEX(end_num,\
  \ '+', -1) AS UNSIGNED)\n             - CAST(SUBSTRING_INDEX(SUBSTRING_INDEX(start_num, '+', 1), 'K', -1) AS UNSIGNED) * 1000\n             - CAST(SUBSTRING_INDEX(start_num, '+', -1) AS UNSIGNED)\n  \
  \         ) / 1000.0,\n           0\n         ),\n         NULLIF(\n           (\n             SELECT SUM(s.end_meter_total - s.start_meter_total) / 1000.0\n             FROM basic_facilities_sections\
  \ s\n             WHERE s.route_id = basic_facilities_routes.id AND s.del_flag = 0\n           ),\n           0\n         ),\n         0\n       ) AS route_length_km\nFROM basic_facilities_routes\n"
columns:
- name: id
  type: VARCHAR
  is_calculated: false
  properties:
    description: id
  is_primary_key: true
- name: full_name
  type: VARCHAR
  is_calculated: false
  properties:
    description: 路线全称
- name: short_name
  type: VARCHAR
  is_calculated: false
