name: section
properties:
  description: 路段台账：一条路线拆成多个路段，带起止桩号、路面类型、技术等级、宽度。
ref_sql: "SELECT *,\n       (\n         CAST(SUBSTRING_INDEX(SUBSTRING_INDEX(end_num, '+', 1), 'K', -1) AS UNSIGNED) * 1000\n         + CAST(SUBSTRING_INDEX(end_num, '+', -1) AS UNSIGNED)\n         - CAST(SUBSTRING_INDEX(SUBSTRING_INDEX(start_num,\
  \ '+', 1), 'K', -1) AS UNSIGNED) * 1000\n         - CAST(SUBSTRING_INDEX(start_num, '+', -1) AS UNSIGNED)\n       ) / 1000.0 AS section_length_km\nFROM basic_facilities_sections\n"
columns:
- name: id
  type: VARCHAR
  is_calculated: false
  properties:
    description: id
  is_primary_key: true
- name: full_name
  type: VARCHAR
  is_calculated: false
  properties:
    description: 路段全称
- name: code
  type: VARCHAR
  is_calculated: false
  properties:
    description: 路段代码
- name: built
  type: VARCHAR
  is_calculated: false
  properties:
    description: 是否内置(0.否(不内置)1.是(内置))
- name: route_id
  type: VARCHAR
  is_calculated: false
  properties:
    description: 所在路线id
- name: route_level
  type: VARCHAR
  is_calculated: false
  properties:
    description: 行政级别（0国道 1省道 2县道 3乡道 4村道）
- name: start_num
  type: VARCHAR
  is_calculated: false
  properties:
    description: 起点桩号
- name: start_name
  type: VARCHAR
  is_calculated: false
  properties:
    description: 起点名称
- name: start_lnt
  type: VARCHAR
  is_calculated: false
  properties:
    description: 起点经度
- name: start_lat
  type: VARCHAR
  is_calculated: false
  properties:
    description: 起点纬度
- name: end_num
  type: VARCHAR
  is_calculated: false
  properties:
