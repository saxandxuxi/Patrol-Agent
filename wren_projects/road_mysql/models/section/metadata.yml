- name: tech_grade_name
  type: VARCHAR
  is_calculated: true
  expression: CASE tech_grade WHEN '0' THEN '高速公路' WHEN '1' THEN '一级公路' WHEN '2' THEN '二级公路' WHEN '3' THEN '三级公路' WHEN '4' THEN '四级公路' WHEN '5' THEN '等外公路' ELSE COALESCE(NULLIF(tech_grade, ''), '未填写') END
  properties:
    description: 公路技术等级
- name: route_level_name
  type: VARCHAR
  is_calculated: true
  expression: CASE route_level WHEN '0' THEN '国道' WHEN '1' THEN '省道' WHEN '2' THEN '县道' WHEN '3' THEN '乡道' WHEN '4' THEN '村道' ELSE COALESCE(NULLIF(route_level, ''), '未填写') END
  properties:
    description: 行政等级
primary_key: id
cached: false
