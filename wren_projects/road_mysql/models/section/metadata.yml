  properties:
    description: 路面类型（11 沥青混凝土 12 水泥混凝土 21 沥青贯入式 22 沥青碎石 23 沥青表面处治 31 砂石路面 32 石质路面 33 渣石路面 34 砖铺路面 35 砼预制块 36 无路面）
