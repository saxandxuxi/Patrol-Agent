- name: end_lat
  type: VARCHAR
  is_calculated: false
  properties:
    description: 终点纬度
- name: distance
  type: DECIMAL
  is_calculated: false
  properties:
    description: 公路实际里程（km）原始值。台账填写值，**实测不准**（西乡段写 5.60、按起止 桩号算只有 5.10）。用户点名要看这一列时原样返回；算长度/密度用 section_length_km。
- name: abslute_distance
  type: INTEGER
  is_calculated: false
  properties:
    description: 起点终点的直接坐标距离（单位：米）
- name: speed_limit
  type: DECIMAL
  is_calculated: false
  properties:
    description: 最高限速(千米/小时)
- name: surface_width
  type: DECIMAL
