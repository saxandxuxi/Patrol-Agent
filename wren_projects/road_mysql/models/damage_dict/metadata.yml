name: damage_dict
properties:
  description: 病害类型字典。病害表按 problem_base_id = id 精确关联，按 id 保留每条记录， 避免 problem_code 重复时把病害数量放大。
ref_sql: "SELECT id, problem_code, problem_type, disease_categories_type,\n       length_unit, formula, del_flag\nFROM ai_problem_base\nWHERE problem_type IS NOT NULL\n  AND (del_flag = 0 OR del_flag IS\
  \ NULL)\n"
columns:
- name: id
  type: VARCHAR
  is_calculated: false
  properties:
    description: id
  is_primary_key: true
- name: problem_type
  type: VARCHAR
  is_calculated: false
  properties:
    description: 病害类型
- name: problem_code
  type: VARCHAR
  is_calculated: false
  properties:
    description: 病害代码
- name: enable_type
  type: VARCHAR
  is_calculated: false
  properties:
    description: 病害基础状态(0启用、1禁用）
- name: disease_categories_type
  type: VARCHAR
  is_calculated: false
  properties:
    description: 所属大类（0路面病害，5路基病害，10沿路设施，15交安事件）
- name: main_focus
  type: VARCHAR
  is_calculated: false
  properties:
    description: 是否主要关注类型(0.否1.是)
- name: problem_alias
  type: VARCHAR
  is_calculated: false
  properties:
    description: 别名
- name: problem_description
  type: VARCHAR
  is_calculated: false
  properties:
    description: 病害描述
- name: is_built
  type: VARCHAR
  is_calculated: false
  properties:
    description: 是否内置不可删除(0.否1.是)
- name: length_unit
  type: VARCHAR
  is_calculated: false
  properties:
    description: 单位
- name: formula
  type: VARCHAR
  is_calculated: false
  properties:
    description: 计算公式
- name: memo
  type: VARCHAR
  is_calculated: false
  properties:
    description: 备注
- name: problem_icon
  type: VARCHAR
  is_calculated: false
  properties:
    description: 病害图标
- name: problem_sample_image
  type: VARCHAR
  is_calculated: false
  properties:
    description: 病害样图
- name: problem_color
  type: VARCHAR
  is_calculated: false
  properties:
    description: 病害颜色
- name: confidence
  type: DOUBLE
  is_calculated: false
  properties:
    description: 置信度阈值
- name: create_time
  type: DATETIME
  is_calculated: false
  properties:
    description: 创建时间
- name: create_by
  type: VARCHAR
  is_calculated: false
  properties:
    description: 创建人
- name: del_flag
  type: CHAR
  is_calculated: false
  properties:
    description: 删除标记
- name: tenant_id
  type: VARCHAR
  is_calculated: false
  properties:
    description: 所属租户id
- name: update_time
  type: DATETIME
  is_calculated: false
  properties:
    description: 更新
- name: update_by
  type: VARCHAR
  is_calculated: false
  properties:
    description: 修改人
- name: init_icon_image
  type: VARCHAR
  is_calculated: false
  properties:
    description: 内置图标图片
- name: init_image
  type: VARCHAR
  is_calculated: false
  properties:
    description: 内置图片
- name: inspection_obj_type
  type: VARCHAR
  is_calculated: false
  properties:
    description: 主体类型
- name: category_name
  type: VARCHAR
  is_calculated: true
  expression: CASE disease_categories_type WHEN '0' THEN '路面病害' WHEN '5' THEN '路基病害' WHEN '10' THEN '沿路设施' WHEN '15' THEN '交安事件' ELSE disease_categories_type END
  properties:
    description: 病害大类（路面病害/路基病害/沿路设施/交安事件）
primary_key: id
cached: false
