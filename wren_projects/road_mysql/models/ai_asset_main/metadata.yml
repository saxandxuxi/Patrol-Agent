- name: transaction_equipment
  type: VARCHAR
  is_calculated: false
  properties:
    description: 异动设备
- name: map_position
  type: VARCHAR
  is_calculated: false
  properties:
    description: 地图标识(位置)
- name: pic_position
  type: VARCHAR
  is_calculated: false
