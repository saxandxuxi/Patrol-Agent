- name: create_time
  type: DATETIME
  is_calculated: false
  properties:
    description: 创建时间
- name: create_by
  type: VARCHAR
  is_calculated: false
  properties:
    description: 创建人
- name: del_flag
  type: CHAR
  is_calculated: false
  properties:
    description: 删除标记
- name: update_time
  type: DATETIME
  is_calculated: false
  properties:
    description: 更新
- name: update_by
  type: VARCHAR
  is_calculated: false
  properties:
    description: 修改人
- name: tenant_id
  type: VARCHAR
  is_calculated: false
  properties:
    description: 所属租户id
primary_key: id
cached: false
